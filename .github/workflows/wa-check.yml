name: WA-JS check
on:
  workflow_dispatch:
  push:
    paths: ['.github/webapi-test/wa-check.mjs']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd .github/webapi-test && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - run: cd .github/webapi-test && ASSETS=$GITHUB_WORKSPACE/app/src/main/assets/webapi node wa-check.mjs
