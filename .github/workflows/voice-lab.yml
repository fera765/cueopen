name: voice-lab
on:
  push:
    paths: ["tools/voice_lab/**", ".github/workflows/voice-lab.yml"]
  workflow_dispatch:
    inputs:
      repo:
        description: Repositório da voz no Hugging Face
        default: OpenVoiceOS/pipertts_pt-PT_dii
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --quiet onnx onnxruntime huggingface_hub numpy soundfile sherpa-onnx
      - name: Lab
        working-directory: tools/voice_lab
        env: { VOICE_REPO: "${{ inputs.repo || 'OpenVoiceOS/pipertts_pt-PT_dii' }}" }
        run: python lab.py
      - uses: actions/upload-artifact@v4
        with:
          name: voice-lab
          path: tools/voice_lab/out
