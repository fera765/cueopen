name: CueOpen APK (wallet branch)

on:
  push:
    branches:
      - work/solana-wallet-completion
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: work/solana-wallet-completion
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wallet branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JVM unit tests and build installable release APK
        run: gradle testReleaseUnitTest assembleRelease --stacktrace

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          mkdir -p out
          cp "$apk" out/CueOpen-wallet-latest.apk
          sha256sum out/CueOpen-wallet-latest.apk > out/SHA256SUMS.txt
          ls -lh out/

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cueopen-wallet-latest-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 14
