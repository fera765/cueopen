name: Fluwy APK (wallet branch)

on:
  push:
    branches:
      - work/solana-wallet-completion
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: work/solana-wallet-completion
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wallet branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JVM unit tests and build installable release APK
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --stacktrace 2>&1 | tee /tmp/build.log

      - name: Publish build log to wallet-build-log branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p blog
          cp /tmp/build.log blog/build.log 2>/dev/null || echo "no build log" > blog/build.log
          cd blog
          git init -q
          git checkout -q -b wallet-build-log
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -q -m "app build log #${{ github.run_number }} (${{ github.sha }})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" wallet-build-log

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          mkdir -p out
          cp "$apk" out/Fluwy-wallet-latest.apk
          sha256sum out/Fluwy-wallet-latest.apk > out/SHA256SUMS.txt
          ls -lh out/

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluwy-wallet-latest-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK + checksum to wallet-build-output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp todo.md out/ 2>/dev/null || true
          cd out
          git init -q
          git checkout -q -b wallet-build-output
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -q -m "wallet APK build #${{ github.run_number }} (${{ github.sha }})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" wallet-build-output
          echo "Published APK to wallet-build-output branch."

  instrumented-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout wallet branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile instrumented test sources
        run: |
          set -o pipefail
          gradle assembleDebugAndroidTest --stacktrace 2>&1 | tee /tmp/at-compile.log

      - name: Publish androidTest compile log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diag
          cp /tmp/at-compile.log diag/at-compile.log 2>/dev/null || echo "no log" > diag/at-compile.log
          cd diag
          git init -q
          git checkout -q -b wallet-diagnostics
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -q -m "androidTest compile log #${{ github.run_number }}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" wallet-diagnostics

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented wallet tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: set -o pipefail; gradle connectedDebugAndroidTest --stacktrace 2>&1 | tee /tmp/at-run.log

      - name: Publish instrumented test run log + results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagrun
          cp /tmp/at-run.log diagrun/at-run.log 2>/dev/null || echo "no run log" > diagrun/at-run.log
          # Collect per-test XML results (compact, parseable) if present.
          find app/build/outputs/androidTest-results -name '*.xml' -exec cp {} diagrun/ \; 2>/dev/null || true
          cd diagrun
          git init -q
          git checkout -q -b wallet-testrun
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -q -m "instrumented test run #${{ github.run_number }}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" wallet-testrun

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-${{ github.run_number }}
          path: app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
