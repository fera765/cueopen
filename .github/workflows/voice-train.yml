name: voice-train
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/voice-train.yml"]
permissions:
  contents: read
env:
  GENDER: F
  MAX_HOURS: "2.0"
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q "datasets<4" soundfile librosa scipy numpy
      - run: cd tools/voice_train && python prep.py && cat ds/info.json && du -sh ds
      - uses: actions/upload-artifact@v4
        with: { name: dataset, path: tools/voice_train/ds, retention-days: 7 }
  s1:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake ninja-build ffmpeg espeak-ng >/dev/null
      - name: Piper (treino)
        run: |
          git clone -q --depth 1 https://github.com/OHF-voice/piper1-gpl.git /tmp/piper1
          cd /tmp/piper1 && pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -q -e '.[train]'
          ./build_monotonic_align.sh >/dev/null && python3 setup.py build_ext --inplace >/dev/null
          pip install -q faster-whisper soundfile scipy huggingface_hub
      - uses: actions/download-artifact@v4
        with: { name: dataset, path: ds }
      - name: Checkpoint inicial (Faber)
        run: python -c "from huggingface_hub import hf_hub_download as h; import shutil; shutil.copy(h('rhasspy/piper-checkpoints','pt/pt_BR/faber/medium/epoch=1999-step=92000.ckpt',repo_type='dataset'),'start.ckpt')"
      - name: Treino (etapa 1, ~5 h na CPU)
        run: |
          timeout 18300 python3 -m piper.train fit \
            --data.voice_name voz-br --data.csv_path ds/metadata.csv --data.audio_dir ds/wavs \
            --model.sample_rate 22050 --data.espeak_voice pt-br --data.cache_dir cache --data.config_path config.json \
            --data.batch_size 16 --ckpt_path start.ckpt \
            --trainer.accelerator cpu --trainer.devices 1 --trainer.max_epochs 100000 --trainer.max_time 00:05:00:00 \
            --trainer.default_root_dir runs 2>&1 | grep -vE "^\s*$" | tail -40 || true
          CK=$(ls -t $(find runs -name '*.ckpt') | head -1); echo "checkpoint: $CK"; mkdir -p out && cp "$CK" out/last.ckpt && cp config.json out/ && cp -r cache out/cache
      - name: Exporta e avalia (Whisper + UTMOS)
        run: |
          python3 -m piper.train.export_onnx --checkpoint out/last.ckpt --output-file out/model.onnx
          python3 tools/voice_train/evalstage.py out/model.onnx out/config.json s1
      - uses: actions/upload-artifact@v4
        with: { name: ckpt-s1, path: out, retention-days: 7 }
