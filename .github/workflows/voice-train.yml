name: voice-train
on:
  workflow_dispatch:
  push:
    paths: ["tools/voice_train/**", ".github/workflows/voice-train.yml"]
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q huggingface_hub && python tools/voice_train/explore.py
      - run: nproc; free -g; df -h / | tail -1
