name: Build installable debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Remove versioned release keystore before build
        run: rm -f app/fluwy-release.jks

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Node 22 (mini-hub de conectores)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mini-hub - testes locais
        run: node tools/minihub/test-local.js

      - name: Mini-hub - verificar conectores reais e gerar catálogo do APK
        run: |
          set -euo pipefail
          mkdir -p out-minihub
          node tools/minihub/build-catalog.js app/src/main/assets/minihub/catalog.json out-minihub/report.json
          ls -lh app/src/main/assets/minihub/

      - name: Motor de voz (sherpa-onnx 1.10.46 AAR)
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fsSL -o app/libs/sherpa-onnx-1.10.46.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.10.46/sherpa-onnx-1.10.46.aar
          unzip -l app/libs/sherpa-onnx-1.10.46.aar | grep -E "jni/(arm64|x86_64)" | head

      - name: Cache do motor Phonon
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            phonon-libs
          key: phonon-xn-ptts-v1-${{ hashFiles('.github/phonon-ref') }}

      - name: Motor Phonon (libptts_ffi arm64, rápida + compatível)
        run: |
          set -euo pipefail
          REF=$(cat .github/phonon-ref)
          if [ ! -f phonon-libs/libptts_ffi.so ] || [ ! -f phonon-libs/PhononTTS.kt ]; then
            git clone https://github.com/gradium-ai/xn-ptts /tmp/xn-ptts
            git -C /tmp/xn-ptts checkout "$REF"
            cargo install cargo-ndk --locked
            export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
            mkdir -p phonon-libs
            (cd /tmp/xn-ptts && ./android/build.sh)
            cp /tmp/xn-ptts/android/jniLibs/arm64-v8a/libptts_ffi.so phonon-libs/libptts_ffi.so
            (cd /tmp/xn-ptts && ARM64_FEATURES= ./android/build.sh)
            cp /tmp/xn-ptts/android/jniLibs/arm64-v8a/libptts_ffi.so phonon-libs/libptts_ffi_compat.so
            cp /tmp/xn-ptts/android/PhononTTS.kt phonon-libs/PhononTTS.kt
          fi
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/java/dev/fluwy/app/voice/phonon
          cp phonon-libs/libptts_ffi.so phonon-libs/libptts_ffi_compat.so app/src/main/jniLibs/arm64-v8a/
          sed -e '0,/^package .*/s//package dev.fluwy.app.voice.phonon/' \
              -e 's/"ptts_ffi"/dev.fluwy.app.voice.PhononVoice.libName/' \
              phonon-libs/PhononTTS.kt > app/src/main/java/dev/fluwy/app/voice/phonon/PhononTTS.kt
          grep -q "PhononVoice.libName" app/src/main/java/dev/fluwy/app/voice/phonon/PhononTTS.kt
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Run JVM unit tests and assemble debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Verify package, label, debug signature, and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK path is not set}}"
          tools="$sdk/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          badging="$("$tools/aapt" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "package: name='com.fluwy.bot'"
          printf '%s\n' "$badging" | grep -F "application-label:'Fluwy Bot'"
          mkdir -p out
          cp "$apk" out/Fluwy-Bot-debug.apk
          cp out-minihub/report.json out/minihub-report.json || true
          unzip -t out/Fluwy-Bot-debug.apk >/dev/null
          "$tools/apksigner" verify --print-certs out/Fluwy-Bot-debug.apk | tee out/SIGNING-CERTIFICATE.txt
          sha256sum out/Fluwy-Bot-debug.apk > out/SHA256SUMS.txt
          ls -lh out/

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluwy-bot-debug-apk-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 14
