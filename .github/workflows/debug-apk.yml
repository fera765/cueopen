name: Build installable debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Remove versioned release keystore before build
        run: rm -f app/cueopen-release.jks

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JVM unit tests and assemble debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          mkdir -p out
          cp "$apk" out/CueOpen-debug.apk
          unzip -t out/CueOpen-debug.apk >/dev/null
          sha256sum out/CueOpen-debug.apk > out/SHA256SUMS.txt
          ls -lh out/

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cueopen-debug-apk-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 14
