name: voice-pack
on:
  push:
    paths: ["tools/voice_pack/**", ".github/workflows/voice-pack.yml"]
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q "sherpa-onnx==1.10.46" onnx onnxruntime huggingface_hub numpy soundfile
      - run: cd tools/voice_pack && python pack.py
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la tools/voice_pack/dist
          gh release delete voices-v2 -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create voices-v2 -R "$GITHUB_REPOSITORY" --prerelease --title "Vozes v2 (Piper ajustadas)" --notes "Cadu, Faber, Amy, Lessac, Ryan — fp32 e int8" --target "$GITHUB_SHA" tools/voice_pack/dist/*
