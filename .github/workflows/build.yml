name: build-apk
# Manual-only release validation. Do not build until wallet release gates are reviewed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run JVM unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Run Android lint
        run: gradle lintDebug --stacktrace
      - name: Assemble release APK
        run: gradle assembleRelease --stacktrace
      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          mkdir -p out
          cp "$apk" out/CueOpen.apk
          sha256sum out/CueOpen.apk > out/SHA256SUMS.txt
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: cueopen-release-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 14
