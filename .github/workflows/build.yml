name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        run: gradle assembleDebug --stacktrace 2>&1 | tee build.log
        continue-on-error: true
      - name: Publicar resultado na branch build-output
        run: |
          mkdir -p out && cp build.log out/
          cp app/build/outputs/apk/debug/*.apk out/CueOpen.apk 2>/dev/null || echo "sem apk" > out/FAILED
          cd out && git init -q && git checkout -q -b build-output
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-output
