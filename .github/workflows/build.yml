name: build-apk
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Kotlin changes
        shell: bash
        run: |
          set -euo pipefail
          gradle testDebugUnitTest --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build.log
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
      - name: Preparar saída e logs
        if: always()
        shell: bash
        run: |
          mkdir -p out
          if [ -f build.log ]; then cp build.log out/build.log; else echo 'build nao rodou' > out/build.log; fi
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -n "$apk" ] && [ -s "$apk" ]; then
            cp "$apk" out/CueOpen.apk
            sha256sum out/CueOpen.apk > out/SHA256SUMS.txt
          else
            echo "APK nao foi gerado; consulte build.log" > out/FAILED
          fi
      - name: Publicar logs e APK como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cueopen-build-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 14
      - name: Publicar resultado na branch build-output
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          cd out
          git init -q
          git checkout -q -b build-output
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -A
          git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-output
