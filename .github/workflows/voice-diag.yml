name: voice-diag
on:
  push:
    paths: ["tools/voice_diag/**", ".github/workflows/voice-diag.yml"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q "sherpa-onnx==1.10.46" numpy soundfile faster-whisper
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: cd tools/voice_diag && mkdir -p pk && gh release download voices-v2 -R "$GITHUB_REPOSITORY" -p '*.zip' -D pk && python diag.py
      - if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete voice-diag -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create voice-diag -R "$GITHUB_REPOSITORY" --prerelease --title "Diagnóstico de voz" --notes "diag" --target "$GITHUB_SHA" tools/voice_diag/out/*
