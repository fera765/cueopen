name: voice-diag
on:
  push:
    paths: ["tools/voice_diag/**", "tools/voice_lab3/normalize_pt.py", ".github/workflows/voice-diag.yml"]
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        voice: [cadu, faber, amy, lessac, ryan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q "sherpa-onnx==1.10.46" numpy soundfile faster-whisper
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: cd tools/voice_diag && mkdir -p pk && gh release download voices-v2 -R "$GITHUB_REPOSITORY" -p "piper-${{ matrix.voice }}-int8.zip" -D pk && python tune.py ${{ matrix.voice }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "tune-${{ matrix.voice }}", path: tools/voice_diag/out/ }
  publish:
    needs: tune
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, pattern: "tune-*", merge-multiple: true }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete voice-diag -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create voice-diag -R "$GITHUB_REPOSITORY" --prerelease --title "Ajuste por Whisper" --notes "tune" --target "$GITHUB_SHA" out/*
