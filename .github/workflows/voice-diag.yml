name: voice-diag
on:
  workflow_dispatch:
  push:
    paths: ["tools/voice_diag/**", ".github/workflows/voice-diag.yml"]
permissions:
  contents: read
jobs:
  phon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: voices, path: tools/voice_diag/pk }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q piper-tts huggingface_hub "sherpa-onnx==1.10.46"
      - run: cd tools/voice_diag && python phon.py && python phon_sherpa.py 2>&1 | grep -viE "^\s*$" | head -200
