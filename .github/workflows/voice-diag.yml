name: voice-diag
on:
  workflow_dispatch:
  push:
    paths: ["tools/voice_diag/**", ".github/workflows/voice-diag.yml"]
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        voice: [cadu, faber, lessac, ryan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: voices, path: tools/voice_diag/pk }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q numpy soundfile faster-whisper num2words huggingface_hub "sherpa-onnx==1.10.46"
      - run: cd tools/voice_diag && python ab.py ${{ matrix.voice }} sherpa
