name: voice-diag
on:
  workflow_dispatch:
  push:
    paths: ["tools/voice_diag/**", "tools/voice_lab3/normalize_pt.py", ".github/workflows/voice-diag.yml"]
permissions:
  contents: read
jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        voice: [cadu, faber, lessac, ryan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: voices, path: tools/voice_diag/pk }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q numpy soundfile faster-whisper num2words "sherpa-onnx==1.10.46"
      - run: cd tools/voice_diag && python tune.py ${{ matrix.voice }}
