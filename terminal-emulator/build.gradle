// Vendored de termux/termux-app (Apache-2.0) — emulador de terminal + PTY nativo via JNI (libtermux.so)
apply plugin: 'com.android.library'
android {
    namespace "com.termux.emulator"
    compileSdk 35
    ndkVersion "27.2.12479018"
    defaultConfig {
        minSdk 26
        externalNativeBuild { ndkBuild { cFlags "-std=c11", "-Wall", "-Os", "-fno-stack-protector" } }
        ndk { abiFilters 'x86_64', 'armeabi-v7a', 'arm64-v8a' }
    }
    externalNativeBuild { ndkBuild { path "src/main/jni/Android.mk" } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false }
}
dependencies {
    implementation "androidx.annotation:annotation:1.9.0"
    testImplementation "junit:junit:4.13.2"
}
