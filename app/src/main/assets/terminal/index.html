<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
 html,body{margin:0;height:100%;background:#0f1115;overflow:hidden}
 #t{position:absolute;inset:6px 4px 4px 8px}
 #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font:14px sans-serif;text-align:center;padding:24px;pointer-events:none}
</style>
<script src="xterm.js"></script><script src="addon-fit.js"></script><script src="addon-web-links.js"></script>
</head><body><div id="t"></div><div id="msg">Conectando ao terminal…</div>
<script>
// Espelho do terminal: a conexão com o PTY (axs) fica no Kotlin (TerminalManager),
// que sobrevive com o app em segundo plano. Aqui só renderizamos e repassamos o teclado.
var term=new Terminal({fontSize:13,fontFamily:'monospace',cursorBlink:true,scrollback:8000,allowProposedApi:true,
  theme:{background:'#0f1115',foreground:'#e6e6e6',cursor:'#ff6b3d',selectionBackground:'#5a3a2e'}});
var fit=new FitAddon.FitAddon(); term.loadAddon(fit); term.loadAddon(new WebLinksAddon.WebLinksAddon());
term.open(document.getElementById('t')); fit.fit();
term.onData(function(d){ if(window.FluwyBridge) FluwyBridge.input(d); });
term.onResize(function(s){ if(window.FluwyBridge) FluwyBridge.resize(s.cols,s.rows); });
document.addEventListener('click',function(){ term.focus(); if(window.FluwyBridge) FluwyBridge.showKeyboard(); });
window.FluwyTerm={
  write:function(s){ document.getElementById('msg').style.display='none'; term.write(s); },
  reset:function(){ term.reset(); },
  focus:function(){ term.focus(); },
  fail:function(m){ var el=document.getElementById('msg'); el.style.display='flex'; el.textContent=m; }
};
window.addEventListener('resize',function(){ setTimeout(function(){ fit.fit(); },60); });
if(window.FluwyBridge) FluwyBridge.ready(term.cols, term.rows);
</script></body></html>
