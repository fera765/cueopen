<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluwy</title>
<style>
 :root{--bg:#fbfaf7;--ink:#151515;--ink2:#6b6760;--line:#e6e2da;--card:#fff;--accent:#ff6b3d}
 @media (prefers-color-scheme:dark){:root{--bg:#111;--ink:#f3f1ec;--ink2:#9c978e;--line:#2f2e2c;--card:#1a1a1a}}
 *{box-sizing:border-box}
 body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:18vh 20px 24px}
 .logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:30px;letter-spacing:-.5px;margin-bottom:28px}
 .logo svg{width:52px;height:52px}
 form{width:100%;max-width:560px;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
 input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:17px;padding:10px 0}
 button{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:20px}
 .links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px;max-width:560px}
 .links a{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;font-size:14px}
 .hint{margin-top:auto;color:var(--ink2);font-size:12px;padding-top:40px}
</style></head><body>
<div class="logo">
 <svg viewBox="0 0 108 108"><path fill="#FF6B3D" stroke="#111" stroke-width="5" d="M54,22C72,22 82,34 82,52C82,72 70,84 54,84C38,84 26,72 26,52C26,34 36,22 54,22Z"/><path fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M40,46L48,53L40,60"/><path stroke="#111" stroke-width="6" stroke-linecap="round" d="M54,62L68,62"/></svg>
 Fluwy
</div>
<form id="f" autocomplete="off">
 <input id="q" type="search" placeholder="Pesquisar no Google ou digitar URL" enterkeyhint="search" autofocus>
 <button type="submit" aria-label="Buscar">→</button>
</form>
<div class="links">
 <a href="https://news.google.com/?hl=pt-BR">Notícias</a>
 <a href="https://www.youtube.com">YouTube</a>
 <a href="https://github.com">GitHub</a>
 <a href="https://pt.wikipedia.org">Wikipédia</a>
 <a href="https://maps.google.com">Mapas</a>
</div>
<div class="hint">Página inicial do browser do agente</div>
<script>
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault(); var q=document.getElementById('q').value.trim(); if(!q) return;
  var isUrl=/^(https?:\/\/|file:)/i.test(q)||(/^[^\s]+\.[a-z]{2,}(\/.*)?$/i.test(q));
  location.href = isUrl ? (/^[a-z]+:/i.test(q)?q:'https://'+q) : 'https://www.google.com/search?q='+encodeURIComponent(q);
});
</script></body></html>
